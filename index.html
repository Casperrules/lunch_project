<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e9e9dc">
  <title>Word / Way — a four-letter word ladder</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c3028;
      --paper: #f7f7ee;
      --ground: #e9e9dc;
      --lime: #d7ed71;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--ground);
      color: var(--ink);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible {
      outline: 3px solid #e29b60;
      outline-offset: 3px;
    }
    .field-label, .result-label {
      font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    }
    .page { min-height: 100vh; display: flex; padding: 24px; }
    .workbench { width: min(100%, 560px); margin: auto; background: var(--paper); border: 1px solid #d5dacd; padding: clamp(25px, 3.2vw, 48px); box-shadow: 0 18px 50px #263b2410; }
    .card-heading { display: flex; justify-content: space-between; gap: 15px; align-items: start; margin-bottom: 36px; }
    .card-heading h1 { font-size: 24px; letter-spacing: -.055em; margin: 0 0 7px; }
    .card-heading p { color: #819087; font-size: 12px; margin: 0; }
    .card-index { color: #9ba99b; font-family: Georgia, serif; font-style: italic; font-size: 15px; }
    .inputs { display: grid; grid-template-columns: 1fr 44px 1fr; gap: 10px; align-items: end; }
    .field-label { display: block; color: #738378; margin-bottom: 11px; }
    .word-input {
      display: block; width: 100%; min-width: 0; height: 70px; padding: 0 16px;
      border: 1px solid #cbd3c7; border-radius: 0; background: #fff;
      color: var(--ink); text-transform: uppercase; font-size: clamp(22px, 2.4vw, 30px);
      font-weight: 700; letter-spacing: .16em;
    }
    .word-input::placeholder { color: #c8d0c5; }
    .swap { width: 44px; height: 70px; border: 0; background: transparent; color: #788a7d; font-size: 22px; }
    .swap:hover { color: var(--ink); }
    .submit {
      width: 100%; min-height: 64px; display: flex; justify-content: space-between; align-items: center;
      margin-top: 18px; padding: 0 21px; border: 0; background: var(--ink); color: #f7f9ec;
      font-weight: 700; font-size: 13px; letter-spacing: .02em; text-align: left;
    }
    .submit:hover { background: #304b3d; }
    .submit:disabled { cursor: wait; opacity: .6; }
    .submit-arrow { color: var(--lime); font-size: 23px; font-weight: 400; }
    .form-note { min-height: 19px; margin: 13px 0 0; color: #748278; font-size: 12px; line-height: 1.5; }
    .form-note.error { color: #a44032; }
    .retry { padding: 0; border: 0; background: none; color: var(--ink); font-size: 12px; text-decoration: underline; }
    .source { color: #748278; font-size: 11px; margin: 10px 0 0; }
    .source a { color: inherit; }
    .result { margin-top: 31px; border-top: 1px solid #d8ded2; padding-top: 25px; }
    .result-top { display: flex; justify-content: space-between; align-items: baseline; gap: 15px; }
    .result-label { color: #77877b; }
    .result-count { color: #7e8d81; font-size: 11px; }
    .empty { color: #8d998e; font-size: 13px; line-height: 1.6; margin: 21px 0 6px; }
    .path { list-style: none; padding: 0; margin: 23px 0 0; }
    .path li { display: flex; align-items: center; gap: 17px; min-height: 45px; position: relative; }
    .path li:not(:last-child)::after {
      content: ""; position: absolute; top: 31px; bottom: -14px; left: 12px;
      border-left: 1px solid #bdc9b8;
    }
    .step-number {
      position: relative; z-index: 1; flex: 0 0 25px; height: 25px; display: grid; place-items: center;
      background: var(--paper); border: 1px solid #cbd5c8; border-radius: 50%; color: #91a08e;
      font-size: 9px; font-weight: 700;
    }
    .path li:first-child .step-number, .path li:last-child .step-number { background: var(--ink); border-color: var(--ink); color: var(--lime); }
    .step-word { display: flex; gap: 3px; font-size: 19px; font-weight: 700; letter-spacing: .09em; }
    .letter { display: inline-grid; place-items: center; width: 23px; height: 27px; }
    .letter.changed { background: var(--lime); }
    .step-tag { margin-left: auto; color: #94a194; font-size: 9px; letter-spacing: .11em; text-transform: uppercase; font-weight: 700; }
    .legend { margin-top: 19px; color: #8a998c; font-size: 11px; }
    .legend::before { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--lime); margin-right: 7px; }
    @media (max-width: 760px) {
      .page { padding: 22px; }
      .workbench { padding: 26px 22px; }
      .card-heading { margin-bottom: 27px; }
    }
    @media (max-width: 370px) {
      .page { padding: 16px; }
      .workbench { padding: 23px 16px; }
      .inputs { grid-template-columns: minmax(0, 1fr) 32px minmax(0, 1fr); gap: 5px; }
      .swap { width: 32px; }
      .word-input { padding: 0 9px; font-size: 21px; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .workbench { animation: arrive .5s ease-out both; }
      @keyframes arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    }
  </style>
</head>
<body>
  <main class="page">
      <section class="workbench" aria-labelledby="finder-title">
        <div class="card-heading">
          <div><h1 id="finder-title">Make a connection</h1><p>Two words in. One shortest route out.</p></div>
          <span class="card-index">01 / 01</span>
        </div>
        <form id="finder" novalidate>
          <div class="inputs">
            <label><span class="field-label">Starting word</span><input class="word-input" id="start" type="text" maxlength="4" placeholder="COLD" value="cold" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="form-note"></label>
            <button class="swap" id="swap" type="button" aria-label="Swap starting and target words" title="Swap words">⇄</button>
            <label><span class="field-label">Target word</span><input class="word-input" id="target" type="text" maxlength="4" placeholder="WARM" value="warm" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="form-note"></label>
          </div>
          <button class="submit" type="submit" disabled><span>Find the shortest path</span><span class="submit-arrow" aria-hidden="true">↗</span></button>
          <p class="form-note" id="form-note" role="status">Loading the word list…</p>
          <button class="retry" id="retry" type="button" hidden>Retry loading</button>
          <p class="source">Words from <a href="https://github.com/dwyl/english-words" target="_blank" rel="noopener noreferrer">dwyl/english-words</a></p>
        </form>
        <div class="result" aria-live="polite" aria-atomic="true">
          <div class="result-top"><span class="result-label">The route</span><span class="result-count" id="result-count"></span></div>
          <div id="result"><p class="empty">Your word journey will appear here.</p></div>
        </div>
      </section>
  </main>
  <script>
    const WORD_LIST_URL = "https://raw.githubusercontent.com/dwyl/english-words/master/words_alpha.txt";
    let words = new Set();
    let graph = new Map();

    // Build and retain the complete adjacency list once, rather than generating neighbors during each search.
    function buildGraph(wordSet) {
      const graph = new Map(Array.from(wordSet, word => [word, []]));
      const patterns = new Map();
      for (const word of wordSet) {
        for (let i = 0; i < 4; i++) {
          const pattern = word.slice(0, i) + "*" + word.slice(i + 1);
          if (!patterns.has(pattern)) patterns.set(pattern, []);
          const bucket = patterns.get(pattern);
          for (const neighbor of bucket) {
            graph.get(word).push(neighbor);
            graph.get(neighbor).push(word);
          }
          bucket.push(word);
        }
      }
      return graph;
    }

    function shortestPath(start, target) {
      if (start === target) return [start];
      let front = [start];
      let back = [target];
      const fromStart = new Map([[start, null]]);
      const fromTarget = new Map([[target, null]]);
      const startDepth = new Map([[start, 0]]);
      const targetDepth = new Map([[target, 0]]);

      while (front.length && back.length) {
        const forward = front.length <= back.length;
        const frontier = forward ? front : back;
        const own = forward ? fromStart : fromTarget;
        const other = forward ? fromTarget : fromStart;
        const ownDepth = forward ? startDepth : targetDepth;
        const otherDepth = forward ? targetDepth : startDepth;
        const next = [];
        let meeting = null;
        let bestDistance = Infinity;

        for (const word of frontier) {
          for (const neighbor of graph.get(word)) {
            if (own.has(neighbor)) continue;
            own.set(neighbor, word);
            ownDepth.set(neighbor, ownDepth.get(word) + 1);
            next.push(neighbor);
            if (other.has(neighbor)) {
              const distance = ownDepth.get(neighbor) + otherDepth.get(neighbor);
              if (distance < bestDistance) {
                bestDistance = distance;
                meeting = neighbor;
              }
            }
          }
        }
        if (meeting !== null) {
          const path = [];
          for (let word = meeting; word !== null; word = fromStart.get(word)) path.push(word);
          path.reverse();
          for (let word = fromTarget.get(meeting); word !== null; word = fromTarget.get(word)) path.push(word);
          return path;
        }
        if (forward) front = next;
        else back = next;
      }
      return null;
    }

    const form = document.getElementById("finder");
    const startInput = document.getElementById("start");
    const targetInput = document.getElementById("target");
    const note = document.getElementById("form-note");
    const result = document.getElementById("result");
    const count = document.getElementById("result-count");
    const submit = form.querySelector('button[type="submit"]');
    const retry = document.getElementById("retry");
    let ready = false;
    let edited = false;

    async function loadWords() {
      ready = false;
      submit.disabled = true;
      retry.hidden = true;
      showMessage("Loading the word list…");
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 30000);
      try {
        const response = await fetch(WORD_LIST_URL, { signal: controller.signal });
        if (!response.ok) throw new Error(`Word list request failed: HTTP ${response.status}`);
        const text = await response.text();
        const loadedWords = new Set(text.split(/\r?\n/).filter(word => /^[a-z]{4}$/.test(word)));
        if (loadedWords.size < 1000) throw new Error("The word list is incomplete or invalid.");
        const loadedGraph = buildGraph(loadedWords);
        words = loadedWords;
        graph = loadedGraph;
        ready = true;
        submit.disabled = false;
        showMessage(`${words.size.toLocaleString()} four-letter words ready.`);
        if (!edited) form.requestSubmit();
      } catch (error) {
        console.error("Could not load the word list:", error);
        showMessage("Couldn't load the word list. Check your connection and try again.", true);
        retry.hidden = false;
      } finally {
        clearTimeout(timeout);
      }
    }

    function resetResult() {
      count.textContent = "";
      result.replaceChildren();
    }

    function showMessage(message, isError = false) {
      note.textContent = message;
      note.classList.toggle("error", isError);
    }

    function renderPath(path) {
      const list = document.createElement("ol");
      list.className = "path";
      path.forEach((word, index) => {
        const item = document.createElement("li");
        const number = document.createElement("span");
        number.className = "step-number";
        number.textContent = index + 1;
        const letters = document.createElement("span");
        letters.className = "step-word";
        letters.setAttribute("aria-label", word.toUpperCase());
        for (let i = 0; i < word.length; i++) {
          const letter = document.createElement("span");
          letter.className = "letter" + (index > 0 && word[i] !== path[index - 1][i] ? " changed" : "");
          letter.textContent = word[i].toUpperCase();
          letter.setAttribute("aria-hidden", "true");
          letters.append(letter);
        }
        item.append(number, letters);
        if (index === 0 || index === path.length - 1) {
          const tag = document.createElement("span");
          tag.className = "step-tag";
          tag.textContent = path.length === 1 ? "start & finish" : index === 0 ? "start" : "finish";
          item.append(tag);
        }
        list.append(item);
      });
      result.append(list);
      if (path.length > 1) {
        const legend = document.createElement("p");
        legend.className = "legend";
        legend.textContent = "The letter that changed";
        result.append(legend);
      }
      const changes = path.length - 1;
      count.textContent = `${changes} ${changes === 1 ? "change" : "changes"}`;
    }

    form.addEventListener("submit", event => {
      event.preventDefault();
      if (!ready) return;
      resetResult();
      const start = startInput.value.trim().toLowerCase();
      const target = targetInput.value.trim().toLowerCase();
      for (const [input, word, label] of [[startInput, start, "starting"], [targetInput, target, "target"]]) {
        if (!/^[a-z]{4}$/.test(word)) {
          showMessage(`Enter a ${label} word with exactly four letters.`, true);
          input.focus();
          return;
        }
        if (!words.has(word)) {
          showMessage(`“${word.toUpperCase()}” isn't in this dictionary. Try another ${label} word.`, true);
          input.focus();
          return;
        }
      }
      showMessage(`${words.size.toLocaleString()} four-letter words ready.`);
      const path = shortestPath(start, target);
      if (path) {
        renderPath(path);
      } else {
        const message = document.createElement("p");
        message.className = "empty";
        message.textContent = "No route connects these words in this dictionary. Try another pair.";
        result.append(message);
      }
    });

    for (const input of [startInput, targetInput]) {
      input.addEventListener("input", () => {
        edited = true;
        resetResult();
        if (ready) showMessage(`${words.size.toLocaleString()} four-letter words ready.`);
      });
    }
    document.getElementById("swap").addEventListener("click", () => {
      edited = true;
      [startInput.value, targetInput.value] = [targetInput.value, startInput.value];
      resetResult();
      if (ready) showMessage(`${words.size.toLocaleString()} four-letter words ready.`);
    });
    retry.addEventListener("click", loadWords);
    loadWords();
  </script>
</body>
</html>
